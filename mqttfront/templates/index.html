{% extends "layout.html" %}
{% block body %}
<div class="row">
    <div class="col-md-10 mx-auto">
        <div class="card card-body">
            <h2>Bienvenido {{ session.user_id }}</h2>

            {% set sensor_ids = sensores_id | map(attribute='sensor_id') | unique | list %}
            <form method="post" action="">
                <label for="sensor_id">Selecciona un sensor:</label>
                <select name="sensor_id" id="sensor_id" class="form-select mb-3" required>
                    {% for sid in sensor_ids %}
                        <option value="{{ sid }}">{{ sid }}</option>
                    {% endfor %}
                </select>
                <div class="mb-3">
                    <label for="setpoint">Setpoint (°C):</label>
                    <input type="number" step="any" name="setpoint" id="setpoint" class="form-control">
                </div>
                <button type="submit" name="accion" value="destello" class="btn btn-warning mb-2">Enviar Destello</button>
                <button type="submit" name="accion" value="setpoint" class="btn btn-success mb-2">Enviar Setpoint</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
