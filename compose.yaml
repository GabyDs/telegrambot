services:
  mariadb:
    image: mariadb
    container_name: mariadb
    environment:
      - PUID=1000
      - PGID=1000
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - ./mariadb:/var/lib/mysql:Z
    ports:
      - 3306:3306
    restart: unless-stopped
  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    restart: always
    environment:
      - PMA_HOST=mariadb
      - PMA_ABSOLUTE_URI=https://${DOMINIO}:${PUERTO}/phpmyadmin/
    ports:
      - 8080:80
    depends_on:
      - mariadb
  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    user: "1000:1000"
    ports:
      - 1883:1883
      - ${PUERTO_MQTTS}:8883
    restart: unless-stopped
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/config:/mosquitto/config
      - ./swag/etc/letsencrypt:/var/tmp
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      - URL=${DOMINIO}
      - VALIDATION=dns
      - DNSPLUGIN=duckdns
      - SUBDOMAINS=
    volumes:
      - ./swag:/config
    ports:
      - ${PUERTO}:443/tcp
      - 80:80
    restart: unless-stopped
  telegrambot:
    build:
      context: ./telegrambot
      dockerfile: Dockerfile
    image: telegrambot
    container_name: telegrambot
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - TB_TOKEN=${TB_TOKEN}
      - DOMINIO=${DOMINIO}
      - PUERTO=${PUERTO}
      - PUERTO_MQTTS=${PUERTO_MQTTS}
      - MQTT_USR=${MQTT_USR}
      - MQTT_PASS=${MQTT_PASS}
      - TOPICO_SETPOINT=${TOPICO_SETPOINT}
      - TOPICO_MODO=${TOPICO_MODO}
      - TOPICO_PERIODO=${TOPICO_PERIODO}
      - TOPICO_DESTELLO=${TOPICO_DESTELLO}
      - TOPICO_RELE=${TOPICO_RELE}
      - ID_DEL_DISPOSITIVO=${ID_DEL_DISPOSITIVO}
    restart: unless-stopped
  crud:
    image: crud
    build:
      context: ./crud
      dockerfile: Dockerfile
    container_name: crud
    environment:
      - MYSQL_USER=${CRUD_USER}
      - MYSQL_PASSWORD=${CRUD_PASS}
      - MYSQL_DB=${CRUD_DB}
      - MYSQL_HOST=${MARIADB_SERVER}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - mariadb
  mqttfront:
    image: mqttfront
    build:
      context: ./mqttfront
      dockerfile: Dockerfile
    container_name: mqttfront
    environment:
      - MYSQL_USER=${CRUD_USER}
      - MYSQL_PASSWORD=${CRUD_PASS}
      - MYSQL_DB=${CRUD_DB}
      - SENSORES_DB=${SENSORES_DB}
      - MYSQL_HOST=${MARIADB_SERVER}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - DOMINIO=${DOMINIO}
      - PUERTO_MQTTS=${PUERTO_MQTTS}
      - MQTT_USER=${MQTT_USR}
      - MQTT_PASS=${MQTT_PASS}
      - TOPICO_SETPOINT=${TOPICO_SETPOINT}
      - TOPICO_DESTELLO=${TOPICO_DESTELLO}
    ports:
      - "8001:8001"
    restart: unless-stopped
    depends_on:
      - mariadb